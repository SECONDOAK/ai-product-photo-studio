      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                800: '#18181b', // Zinc-900
                900: '#09090b', // Zinc-950
              },
              primary: {
                DEFAULT: '#ffffff',
                '50': '#fafafa',
                '100': '#f4f4f5',
                '200': '#e4e4e7',
                '300': '#d4d4d8',
                '400': '#a1a1aa',
                '500': '#ffffff', // Button Background (White)
                '600': '#e4e4e7', // Hover Background (Light Gray)

  <script type="importmap">
{

<link rel="stylesheet" href="/index.css">
<style>
  @keyframes spin-border {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .glow-btn-wrapper {
    position: relative;
    border-radius: 9999px;
    overflow: hidden;
    padding: 2px;
  }
  .glow-btn-wrapper::before {
    content: '';
    position: absolute;
    inset: -50%;
    background: conic-gradient(
      from 0deg,
      #6366f1 0%,
      #8b5cf6 15%,
      #a855f7 25%,
      #ec4899 35%,
      #f9a8d4 45%,
      #c084fc 55%,
      #818cf8 65%,
      #6366f1 75%,
      #8b5cf6 85%,
      #6366f1 100%
    );
    animation: spin-border 3s linear infinite;
    z-index: 0;
  }
  .glow-btn-wrapper.disabled::before {
    background: #27272a;
    animation: none;
  }
  .glow-btn-wrapper.loading::before {
    background: conic-gradient(
      from 0deg,
      #dc2626 0%,
      #ef4444 15%,
      #f87171 30%,
      #fca5a5 45%,
      #f87171 60%,
      #ef4444 75%,
      #dc2626 100%
    );
  }
  .glow-btn-inner {
    position: relative;
    z-index: 1;
    border-radius: 9999px;
  }
</style>
</head>
  <body class="bg-black text-zinc-100 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
