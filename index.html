    <title>ShotLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                800: '#18181b', // Zinc-900
                900: '#09090b', // Zinc-950
              },
              primary: {
                DEFAULT: '#ffffff',
                '50': '#fafafa',
                '100': '#f4f4f5',
                '200': '#e4e4e7',
                '300': '#d4d4d8',
                '400': '#a1a1aa',
                '500': '#ffffff', // Button Background (White)
                '600': '#e4e4e7', // Hover Background (Light Gray)
                '700': '#d4d4d8',
                '800': '#27272a',
                '900': '#18181b',
                '950': '#000000',
              },
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "heic2any": "https://esm.sh/heic2any@0.0.4"
  }
}

<link rel="stylesheet" href="/index.css">
<style>
  @property --border-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spin-angle {
    to { --border-angle: 360deg; }
  }
  .glow-btn-wrapper {
    position: relative;
    border-radius: 9999px;
    padding: 2.5px;
    background: conic-gradient(
      from var(--border-angle),
      #6366f1, #8b5cf6, #a855f7, #ec4899,
      #f9a8d4, #c084fc, #818cf8, #6366f1
    );
    animation: spin-angle 3s linear infinite;
  }
  .glow-btn-wrapper.disabled {
    background: #27272a;
    animation: none;
  }
  .glow-btn-wrapper.loading {
    background: conic-gradient(
      from var(--border-angle),
      #dc2626, #ef4444, #f87171, #fca5a5,
      #f87171, #ef4444, #dc2626
    );
  }
  .glow-btn-inner {
    border-radius: 9999px;
  }
</style>
</head>
  <body class="bg-black text-zinc-100 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
